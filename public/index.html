<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/search.svg" type="image/svg+xml">
  <title>Scout Search</title>
  <style>
    /* Keep the first paint independent of both browser bundles. */
    body:has([data-scout-boot]) { margin: 0; background: #fbfbfa; }
    [data-scout-boot] {
      --boot-ground: #fbfbfa; --boot-surface: #fff; --boot-ink: #18191c;
      --boot-soft: #55575e; --boot-accent: #b86e00; --boot-line: #dadbde;
      color: var(--boot-ink); background: var(--boot-ground); min-height: 100svh;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body:has([data-scout-boot]) { background: #0c0d10; }
      [data-scout-boot] {
        --boot-ground: #0c0d10; --boot-surface: #12141a; --boot-ink: #eceef2;
        --boot-soft: #a3a6ad; --boot-accent: #e8a33d; --boot-line: #2f3138;
      }
    }
    [data-scout-boot] .search-rail { box-sizing: border-box; max-width: 808px; margin-inline: auto; padding-inline: 24px; }
    [data-scout-boot] .search-masthead { height: 40px; box-sizing: border-box; background: var(--boot-surface); border-bottom: 1px solid var(--boot-line); }
    [data-scout-boot] .search-masthead-inner, [data-scout-boot] .search-brand { display: flex; align-items: center; }
    [data-scout-boot] .search-masthead-inner { height: 100%; justify-content: space-between; gap: 12px; }
    [data-scout-boot] .search-brand { gap: 8px; font-weight: 500; }
    [data-scout-boot] svg { flex: none; color: var(--boot-accent); }
    [data-scout-boot] .search-status { padding: 1px 8px; border: 1px solid var(--boot-line); border-radius: 999px; color: var(--boot-soft); font-size: 11px; white-space: nowrap; }
    .boot-rail { padding-top: 32px; }
    .boot-rail h1 { margin: 0 0 12px; font: 500 22px/1.25 -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", sans-serif; }
    .boot-field { box-sizing: border-box; height: 42px; border: 1px solid var(--boot-line); border-radius: 4px; background: var(--boot-surface); }
    /* Static by design, including under reduced motion. */
    .boot-row { position: relative; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; padding-left: 124px; }
    .boot-row::before {
      content: ""; position: absolute; top: 10px; left: 0; width: 64px; height: 8px;
      border-radius: 4px; background: var(--boot-line);
    }
    .boot-field + .boot-row { margin-top: 12px; }
    .boot-row span { box-sizing: border-box; width: 70px; height: 28px; border: 1px solid var(--boot-line); border-radius: 4px; background: var(--boot-surface); }
    @media (max-width: 560px) {
      [data-scout-boot] .search-rail { padding-inline: 16px; }
      .boot-rail { padding-top: 24px; }
      .boot-row { margin-top: 9px; padding: 23px 0 0; }
      .boot-row::before { top: 5px; }
      .boot-row span { width: min(70px, 19%); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div data-scout-boot="search">
      <header class="search-masthead">
        <div class="search-rail search-masthead-inner">
          <span class="search-brand">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M9 1 16 5v8l-7 4-7-4V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M9 4.43 13 6.71v4.58L9 13.57 5 11.29V6.71Z" fill="currentColor"/>
            </svg>
            Scout Search
          </span>
          <span class="search-status">Recent transcripts</span>
        </div>
      </header>
      <main class="search-rail boot-rail">
        <h1>Search sessions</h1>
        <div aria-hidden="true">
          <div class="boot-field"></div>
          <div class="boot-row"><span></span><span></span></div>
          <div class="boot-row"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="boot-row"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <noscript>Enable JavaScript to search your session transcripts.</noscript>
      </main>
    </div>
  </div>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</body>
</html>
